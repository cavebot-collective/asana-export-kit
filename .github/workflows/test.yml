name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m asana_export_kit --help
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connector.test.mjs tests/builder.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix "$RUNNER_TEMP/browser-test" --no-save --ignore-scripts playwright@1.64.1
      - run: node "$RUNNER_TEMP/browser-test/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node tests/gui-smoke.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser-test/node_modules
