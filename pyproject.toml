[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asana-export-kit"
version = "0.3.0"
description = "Read-only Asana archives with resumable collection and explicit coverage"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
asana-export = "asana_export_kit.cli:main"

[tool.setuptools.packages.find]
include = ["asana_export_kit*"]

[tool.setuptools.package-data]
asana_export_kit = ["web/*.html", "web/*.js"]
